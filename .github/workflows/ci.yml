name: CI

on:
  push:
    branches:
      - "feature/**"
      - dev
      - staging
      - production

  pull_request:
    branches:
      - master
      - dev
      - staging
      - production

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "315219809073"
  ECR_REPOSITORY: goldenowl-devops
  AWS_ROLE_ARN: arn:aws:iam::315219809073:role/goldenowl-devops-github-actions
  ASG_NAME: goldenowl-devops
  IMAGE_PARAMETER_NAME: /goldenowl-devops/image-uri
  APPLICATION_URL: http://goldenowl-devops-1322176295.ap-southeast-1.elb.amazonaws.com

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest

    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Detect application changes
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if git -C "$GITHUB_WORKSPACE" diff --quiet \
            "$BEFORE_SHA" "$CURRENT_SHA" -- src; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint check
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push Docker image
    if: >-
      github.event_name == 'push' &&
      needs.test.outputs.app_changed == 'true' &&
      (
        github.ref_name == 'dev' ||
        github.ref_name == 'staging' ||
        github.ref_name == 'production'
      )
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-metadata.outputs.image_tag }}
      image_uri: ${{ steps.image-metadata.outputs.image_uri }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: goldenowl-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker image metadata
        id: image-metadata
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SAFE_BRANCH=$(echo "$GITHUB_REF_NAME" |
            tr '[:upper:]' '[:lower:]' |
            sed -E 's/[^a-z0-9_.-]+/-/g' |
            sed -E 's/^[.-]+//; s/[.-]+$//' |
            cut -c1-90)

          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE_TAG="${SAFE_BRANCH}-${SHORT_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Branch: $GITHUB_REF_NAME"
          echo "Image tag: $IMAGE_TAG"
          echo "Image URI: $IMAGE_URI"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE_URI: ${{ steps.image-metadata.outputs.image_uri }}
        run: |
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$IMAGE_URI" \
            ./src

      - name: Push Docker image
        env:
          IMAGE_URI: ${{ steps.image-metadata.outputs.image_uri }}
        run: |
          docker push "$IMAGE_URI"
  
  deploy:
    name: Deploy application through Auto Scaling
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'dev'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: goldenowl-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Update application image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          echo "Deploying image tag: $IMAGE_TAG"
          echo "Deploying image URI: $IMAGE_URI"

          aws ssm put-parameter \
            --name "$IMAGE_PARAMETER_NAME" \
            --type "String" \
            --value "$IMAGE_URI" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Image parameter updated successfully."

      - name: Start Auto Scaling instance refresh
        id: instance-refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 120
            }' \
            --region "$AWS_REGION" \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance refresh started: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh
        env:
          REFRESH_ID: ${{ steps.instance-refresh.outputs.refresh_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --region "$AWS_REGION" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --region "$AWS_REGION" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Attempt $attempt: status=$STATUS, complete=$PERCENTAGE%"

            case "$STATUS" in
              Successful)
                echo "Instance refresh completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "Instance refresh ended with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for instance refresh."
          exit 1

      - name: Verify load-balanced endpoint
        run: |
          RESPONSE=$(curl \
            --fail \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "$APPLICATION_URL")

          echo "Application response: $RESPONSE"

          echo "$RESPONSE" |
            grep -q "Welcome warriors to Golden Owl!"