name: CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "315219809073"
  ECR_REPOSITORY: goldenowl-devops
  AWS_ROLE_ARN: arn:aws:iam::315219809073:role/goldenowl-devops-github-actions
  ASG_NAME: goldenowl-devops
  IMAGE_PARAMETER_NAME: /goldenowl-devops/image-uri
  APPLICATION_URL: http://goldenowl-devops-1322176295.ap-southeast-1.elb.amazonaws.com

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint check
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push Docker image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./src

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
  
  deploy:
    name: Deploy application through Auto Scaling
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: goldenowl-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Update application image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          aws ssm put-parameter \
            --name "$IMAGE_PARAMETER_NAME" \
            --type "String" \
            --value "$IMAGE_URI" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Image parameter updated to: $IMAGE_URI"

      - name: Start Auto Scaling instance refresh
        id: instance-refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{
              "MinHealthyPercentage": 100,
              "MaxHealthyPercentage": 150,
              "InstanceWarmup": 120
            }' \
            --region "$AWS_REGION" \
            --query "InstanceRefreshId" \
            --output text)

          echo "Instance refresh started: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh
        env:
          REFRESH_ID: ${{ steps.instance-refresh.outputs.refresh_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --region "$AWS_REGION" \
              --query "InstanceRefreshes[0].Status" \
              --output text)

            PERCENTAGE=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --region "$AWS_REGION" \
              --query "InstanceRefreshes[0].PercentageComplete" \
              --output text)

            echo "Attempt $attempt: status=$STATUS, complete=$PERCENTAGE%"

            case "$STATUS" in
              Successful)
                echo "Instance refresh completed successfully."
                exit 0
                ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "Instance refresh ended with status: $STATUS"
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for instance refresh."
          exit 1

      - name: Verify load-balanced endpoint
        run: |
          RESPONSE=$(curl \
            --fail \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "$APPLICATION_URL")

          echo "Application response: $RESPONSE"

          echo "$RESPONSE" |
            grep -q "Welcome warriors to Golden Owl!"